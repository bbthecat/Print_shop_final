services:
  - type: web
    name: printflow
    runtime: docker
    plan: free
    branch: main
    # deploy เฉพาะเมื่อ GitHub Actions รัน test ผ่านแล้วเรียก Deploy Hook (Build → Test → Deploy)
    autoDeploy: false
    dockerfilePath: ./code/Dockerfile
    dockerContext: ./code
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
