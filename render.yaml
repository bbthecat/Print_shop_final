services:
  - type: web
    name: printflow
    runtime: docker
    plan: free
    branch: develop
    dockerfilePath: ./code/Dockerfile
    dockerContext: ./code
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
