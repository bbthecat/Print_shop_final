services:
  postgres:
    image: postgres:15-alpine
    container_name: printflow-postgres
    environment:
      POSTGRES_DB: printflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d printflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: printflow-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/printflow
      DB_USER: postgres
      DB_PASSWORD: postgres
      PORT: 8080
    ports:
      - "8080:8080"

volumes:
  postgres_data:
