server:
  port: ${PORT:8080}

spring:
  application:
    name: printflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/printflow}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
