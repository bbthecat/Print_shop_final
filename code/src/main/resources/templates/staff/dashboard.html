<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('แดชบอร์ดพนักงาน')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">
    <div class="page-header">
        <h1>ภาพรวมวันนี้</h1>
        <a class="btn" th:href="@{/staff/orders(status='PENDING')}">ดูงานที่รอยืนยัน</a>
    </div>

    <h2>วันนี้</h2>
    <div class="stats">
        <section class="card">
            <div class="muted">คำสั่งพิมพ์ใหม่วันนี้</div>
            <div class="stat-value" th:text="${today.totalOrders}">0</div>
        </section>
        <section class="card">
            <div class="muted">รอร้านยืนยัน (ทั้งหมด)</div>
            <div class="stat-value" th:text="${pendingCount}">0</div>
        </section>
        <section class="card">
            <div class="muted">รับชำระวันนี้</div>
            <div class="stat-value" th:text="${#numbers.formatDecimal(today.totalSales, 1, 'COMMA', 2, 'POINT')} + ' บาท'">0.00 บาท</div>
        </section>
    </div>

    <h2>30 วันล่าสุด แยกตามสถานะ</h2>
    <section class="card flush">
        <table>
            <thead>
            <tr>
                <th>สถานะ</th>
                <th class="num">จำนวน</th>
                <th class="num"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="entry : ${last30Days.ordersByStatus}">
                <td><span class="badge" th:classappend="'status-' + ${entry.key.name().toLowerCase()}"
                          th:text="${entry.key.label}">รอร้านยืนยัน</span></td>
                <td class="num" th:text="${entry.value}">0</td>
                <td class="num"><a th:href="@{/staff/orders(status=${entry.key})}">ดูรายการ</a></td>
            </tr>
            </tbody>
        </table>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
