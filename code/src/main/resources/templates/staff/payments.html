<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('การชำระเงิน')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">
    <h1>การชำระเงิน</h1>

    <div th:replace="~{fragments/layout :: flash}"></div>

    <table class="card">
        <thead>
        <tr>
            <th>order id</th>
            <th>ยอด</th>
            <th>ช่องทาง</th>
            <th>สถานะ</th>
            <th>ชำระเมื่อ</th>
            <th>บันทึกการชำระ</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${payments.content}">
            <td th:text="${p.orderId}">1</td>
            <td th:text="${p.amount}">0.00</td>
            <td th:text="${p.paymentMethod} ?: '-'">-</td>
            <td><span class="badge" th:text="${p.paymentStatus}">UNPAID</span></td>
            <td th:text="${p.paidAt != null} ? ${#temporals.format(p.paidAt, 'dd/MM/yyyy HH:mm')} : '-'">-</td>
            <td>
                <form th:if="${p.paymentStatus.name() == 'UNPAID'}"
                      th:action="@{/staff/payments/{id}/paid(id=${p.orderId})}"
                      method="post" class="inline-controls">
                    <select name="method">
                        <option th:each="m : ${methods}" th:value="${m}" th:text="${m}">CASH</option>
                    </select>
                    <button type="submit" class="btn btn-small">ชำระแล้ว</button>
                </form>
                <span th:unless="${p.paymentStatus.name() == 'UNPAID'}" class="muted">-</span>
            </td>
        </tr>
        <tr th:if="${payments.isEmpty()}">
            <td colspan="6" class="text-center muted">ยังไม่มีรายการชำระเงิน</td>
        </tr>
        </tbody>
    </table>

    <div class="pagination" th:if="${payments.totalPages > 1}">
        <a th:if="${!payments.first}" th:href="@{/staff/payments(page=${payments.number - 1})}">ก่อนหน้า</a>
        <span th:text="${payments.number + 1} + ' / ' + ${payments.totalPages}">1 / 1</span>
        <a th:if="${!payments.last}" th:href="@{/staff/payments(page=${payments.number + 1})}">ถัดไป</a>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
