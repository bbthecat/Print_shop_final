<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('แก้ไขบริการงานพิมพ์')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container narrow">
    <section class="card">
        <h1>แก้ไขบริการงานพิมพ์</h1>

        <form th:action="@{/admin/services/{id}/edit(id=${serviceId})}" th:object="${serviceForm}" method="post" novalidate>
            <div class="form-group">
                <label for="name">ชื่อบริการ</label>
                <input th:field="*{name}" type="text" th:classappend="${#fields.hasErrors('name')} ? 'invalid'">
                <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="pricingType">ประเภทราคา</label>
                    <select th:field="*{pricingType}">
                        <option value="BLACK_WHITE">ขาวดำ (คิดต่อหน้า)</option>
                        <option value="COLOR">สี (คิดต่อหน้า เกิน 50 หน้าลด 10%)</option>
                        <option value="PHOTO">ภาพถ่าย (คิดต่อแผ่น)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="basePrice">ราคาเริ่มต้น (บาท)</label>
                    <input th:field="*{basePrice}" type="number" step="0.25"
                           th:classappend="${#fields.hasErrors('basePrice')} ? 'invalid'">
                    <div class="field-error" th:if="${#fields.hasErrors('basePrice')}" th:errors="*{basePrice}"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="description">รายละเอียดเพิ่มเติม</label>
                <input th:field="*{description}" type="text">
            </div>

            <button type="submit" class="btn">บันทึก</button>
            <a class="btn btn-secondary" th:href="@{/admin/services}">ยกเลิก</a>
        </form>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
