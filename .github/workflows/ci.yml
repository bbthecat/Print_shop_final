name: CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        cache-dependency-path: code/pom.xml
    - name: Build and test with Maven
      run: cd code && mvn -B clean verify
    - name: Generate Test Report
      if: always()
      run: cd code && mvn -B surefire-report:report-only
    - name: Upload Test Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-report
        path: code/target/reports/

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - name: Trigger Render deploy
      env:
        RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      run: |
        if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
          echo "::error::Secret RENDER_DEPLOY_HOOK_URL is not set"
          exit 1
        fi
        curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
        echo "Render deploy triggered for commit $GITHUB_SHA"
